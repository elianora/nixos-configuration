name: CI Build

on:
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - id: checkout-repository
        name: Checkout Repository
        uses: actions/checkout@v4
      - id: install-nix
        name: Install Nix
        uses: cachix/install-nix-action@v31.11.5
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:nixos-26.05
      - id: install-nixos-rebuild
        name: Install nixos-rebuild
        run: nix-env -i nixos-rebuild -f '<nixpkgs>'
      - id: check-flake
        name: Check Flake
        run: nix flake check --show-trace --all-systems path:./
      - id: dry-build
        name: Dry Build
        run: |
          nixos-rebuild dry-build --show-trace --flake path:./#golden-torizo && \
          nixos-rebuild dry-build --show-trace --flake path:./#mother-brain && \
          nixos-rebuild dry-build --show-trace --falke path:./#ridley
